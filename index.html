<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <script defer src="./js/app.js"></script>
    <script defer src="./data.js"></script>

    <title>UNO-Show'Em-No-Mercy</title>
</head>

<body>
    <h1>Welcome to UNO Show'Em No Mercy</h1>
    <div class="home-page">

        <h3>Lets get Started!</h3>

        <input type="text" class="playerName" placeholder="Enter your name">
        <br/>
        <button class="start">Start Game</button>
    </div>


    <div class="gamePage" style="display: none;">
        <div class="table-area">
            <div id="drawPile" class="deck-stack">
                <p>Card withdrawal</p>
            </div>
            <div id="currentCardArea"></div>
            <h3>Card Now</h3>
            <div id="discardPileCard"></div>
        </div>


        <div id="GameArea"></div>
    </div>
    <div class="player-section">
        <h2 id="displayPlayerName">Your Cards</h2>
        <div id="playerHandDisplay" class="hand-container"></div>
    </div>
    </div>

    <button id="drawCardButton" class="draw-btn">Draw Card 🃏</button>

</body>

</html>
